<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simulador 3D Interactivo - Three.js</title>
    <style>
        :root {
            --bg-color: #f8fafc;
            --panel-bg: #ffffff;
            --text-color: #1e293b;
            --border-color: #e2e8f0;
            --primary-color: #2563eb;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
        body { display: flex; height: 100vh; background-color: var(--bg-color); color: var(--text-color); overflow: hidden; }
        #viewport-container { flex: 1; position: relative; background: #0f172a; }
        #canvas3d { width: 100%; height: 100%; display: block; }
        #sidebar { width: 360px; background: var(--panel-bg); border-left: 1px solid var(--border-color); display: flex; flex-direction: column; padding: 20px; gap: 20px; overflow-y: auto; }
        .panel-section { display: flex; flex-direction: column; gap: 10px; }
        .panel-title { font-size: 14px; font-weight: 700; text-transform: uppercase; color: #64748b; border-bottom: 1px solid var(--border-color); padding-bottom: 6px; }
        .control-group { display: flex; flex-direction: column; gap: 4px; }
        label { font-size: 12px; font-weight: 600; }
        select, input { padding: 8px 12px; border: 1px solid var(--border-color); border-radius: 6px; font-size: 14px; outline: none; background: #f8fafc; }
        .metrics-card { background: #f1f5f9; padding: 12px; border-radius: 6px; display: flex; flex-direction: column; gap: 8px; }
        .metric-row { display: flex; justify-content: space-between; font-size: 13px; }
        .metric-value { font-weight: 700; color: var(--primary-color); }
        #log-container { flex: 1; min-height: 150px; background: #0f172a; color: #38bdf8; font-family: monospace; font-size: 11px; padding: 10px; border-radius: 6px; overflow-y: auto; }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>
    <div id="viewport-container">
        <canvas id="canvas3d"></canvas>
    </div>
    <div id="sidebar">
        <div class="panel-section">
            <div class="panel-title">Configuración de Geometría</div>
            <div class="control-group">
                <label for="shape-select">Forma 3D</label>
                <select id="shape-select">
                    <option value="cube">Cubo (Paralelepípedo)</option>
                    <option value="sphere">Esfera</option>
                    <option value="cylinder">Cilindro</option>
                </select>
            </div>
            <div id="dim-controls" class="panel-section"></div>
        </div>
        <div class="panel-section">
            <div class="panel-title">Métricas Geométricas</div>
            <div class="metrics-card">
                <div class="metric-row">
                    <span>Área Superficial Total:</span>
                    <span id="metric-area" class="metric-value">0.00 u²</span>
                </div>
                <div class="metric-row">
                    <span>Volumen:</span>
                    <span id="metric-volume" class="metric-value">0.00 u³</span>
                </div>
            </div>
        </div>
        <div class="panel-section" style="flex: 1; display: flex; flex-direction: column;">
            <div class="panel-title">Registro de Eventos</div>
            <div id="log-container"></div>
        </div>
    </div>
    <script>
        let scene, camera, renderer, controls, currentMesh;
        const container = document.getElementById('viewport-container');
        const canvas = document.getElementById('canvas3d');
        const logContainer = document.getElementById('log-container');
        const shapeSelect = document.getElementById('shape-select');
        const dimControls = document.getElementById('dim-controls');
        const metricArea = document.getElementById('metric-area');
        const metricVolume = document.getElementById('metric-volume');

        function logEvent(msg) {
            const time = new Date().toLocaleTimeString();
            logContainer.innerHTML += `<div class="log-entry">[${time}] ${msg}</div>`;
            logContainer.scrollTop = logContainer.scrollHeight;
        }

        function init3D() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x0f172a);
            camera = new THREE.PerspectiveCamera(45, container.clientWidth / container.clientHeight, 0.1, 1000);
            camera.position.set(5, 5, 7);
            renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: true });
            renderer.setSize(container.clientWidth, container.clientHeight);
            controls = new THREE.OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;

            const ambientLight = new THREE.AmbientLight(0xffffff, 0.7);
            scene.add(ambientLight);
            const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
            dirLight.position.set(10, 20, 15);
            scene.add(dirLight);

            updateGeometry();
            window.addEventListener('resize', onWindowResize);
            animate();
            logEvent("Simulador 3D inicializado correctamente.");
        }

        function updateGeometry() {
            if (currentMesh) scene.remove(currentMesh);
            const shape = shapeSelect.value;
            let geometry, material = new THREE.MeshStandardMaterial({ color: 0x2563eb, roughness: 0.3, metalness: 0.2 });
            
            dimControls.innerHTML = '';
            if (shape === 'cube') {
                geometry = new THREE.BoxGeometry(2, 2, 2);
                dimControls.innerHTML = `<label>Ancho, Alto, Profundidad: 2 unidades</label>`;
                metricArea.textContent = "24.00 u²";
                metricVolume.textContent = "8.00 u³";
            } else if (shape === 'sphere') {
                geometry = new THREE.SphereGeometry(1.5, 32, 32);
                dimControls.innerHTML = `<label>Radio: 1.5 unidades</label>`;
                metricArea.textContent = "28.27 u²";
                metricVolume.textContent = "14.14 u³";
            } else if (shape === 'cylinder') {
                geometry = new THREE.CylinderGeometry(1, 1, 3, 32);
                dimControls.innerHTML = `<label>Radio: 1 | Altura: 3</label>`;
                metricArea.textContent = "25.13 u²";
                metricVolume.textContent = "9.42 u³";
            }

            currentMesh = new THREE.Mesh(geometry, material);
            scene.add(currentMesh);
            logEvent(`Geometría actualizada a: ${shape}`);
        }

        function onWindowResize() {
            camera.aspect = container.clientWidth / container.clientHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(container.clientWidth, container.clientHeight);
        }

        function animate() {
            requestAnimationFrame(animate);
            if (currentMesh) currentMesh.rotation.y += 0.005;
            controls.update();
            renderer.render(scene, camera);
        }

        shapeSelect.addEventListener('change', updateGeometry);
        init3D();
    </script>
</body>
</html>
